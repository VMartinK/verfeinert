schema_version: verfeinert.experiment.v1
experiment_id: reference-single-analysis
description: Minimal experiment configuration using caller-provided roots.
inputs:
  - input_id: reference-candidates
    kind: candidate_set
    uri: relative://inputs/reference_candidates
    schema_version: verfeinert.staged_package.v1
outputs:
  root_uri: relative://runs/reference_single_analysis
  artifact_policy: write_new
  formats:
    - json
execution:
  mode: sequential
  scope: candidate
  worker_count: 1
  parallelize_candidates: false
  backend: local
reproducibility:
  random_seed: 12345
  record_git_commit: true
  hash_inputs: true
  provenance_level: standard
modules:
  core:
    schema_validation: true
  ansatz_generator:
    template_library: sanz19
  ansatz_analyzer:
    metrics:
      - structural_cost
metadata:
  purpose: schema_example

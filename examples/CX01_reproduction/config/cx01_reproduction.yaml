run:
  run_id: cx01-reproduction
  created_at: "2026-08-06T00:00:00Z"
  random_seed: 12345

paths:
  output_root: outputs

workflow:
  campaign_type: individual
  scientific_execution: [generate, analyze]
  postprocessing: [ranking]
  resume:
    mode: continue

generation:
  family: provided
  candidate_id_prefix: cx01repro
  source_label: cx01_reproduction
  n_qubits: 4
  metadata:
    reproduction: cx01
    default_profile: smoke

analyzer:
  selected_metrics: [structural_cost]
  permissions:
    allow_expensive_metrics: false
    allow_qnode_execution: false
  materialization:
    enabled: false
    backend: pennylane
    device: default.qubit
    interface: autograd
    diff_method: best
  structural_cost:
    reference_id: cx01-reference-L123
    reference_bounds:
      parameter_count:
        min: 1
        max: 48
      depth:
        min: 1
        max: 96
      two_qubit_operation_count:
        min: 0
        max: 24
    component_weights:
      parameter_count: 1
      depth: 1
      two_qubit_operation_count: 1
    allow_operation_count_as_depth_proxy: true
  ranking:
    score_components:
      cost.structural_cost: 1
    combination: weighted_sum
    ascending: true
  metric_configs:
    expressibility:
      n_pairs: 5000
      n_bins: 75
      rng_seed: 12345
    trainability:
      n_repeats: 5000
      rng_seed: 12345

cx01_campaign:
  name: CX-01
  library: sanz19
  n_qubits: 4
  layers: [1, 2, 3]
  mutation:
    type: knock_in
    gate: cx
    scope: template_mutation
    propagation_policy: repeat_mutated_single_layer
  candidate_policy:
    parent_templates: all
    edges: all_valid
    placement: after_rotation_block
    acceptance: valid_all_layers
  analysis_reference:
    metrics: [expressibility, trainability, structural_cost, pareto_front]
    pareto_objectives:
      expressibility: maximize
      trainability: maximize
    cost_thresholds: [1.0, 0.2, 0.1]
    expensive_metrics_default: false

profiles:
  smoke:
    template_ids: [A02, A09]
    layers: [1]
    edges:
      - [0, 1]
      - [1, 2]
    max_candidates: 4
  materialized_smoke:
    template_ids: [A02]
    layers: [1]
    edges:
      - [0, 1]
    max_candidates: 1
    analyzer:
      selected_metrics: [structural_cost, expressibility, trainability]
      permissions:
        allow_expensive_metrics: true
        allow_qnode_execution: true
      materialization:
        enabled: true
        backend: pennylane
        device: default.qubit
        interface: autograd
        diff_method: best
      metric_configs:
        expressibility:
          n_pairs: 3
          n_bins: 3
          rng_seed: 7
        trainability:
          n_repeats: 2
          rng_seed: 7
  full:
    template_ids: all
    layers: [1, 2, 3]
    edges: all_valid
    max_candidates: null

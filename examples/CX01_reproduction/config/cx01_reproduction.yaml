run:
  run_id: cx01-reproduction
  created_at: "2026-08-06T00:00:00Z"
  random_seed: 12345

paths:
  output_root: outputs

workflow:
  stages: [generate, analyze, evolve, rank]

generation:
  family: provided
  candidate_id_prefix: cx01repro
  source_label: cx01_reproduction
  n_qubits: 4
  metadata:
    reproduction: cx01
    default_profile: smoke

analyzer:
  selected_metrics: [structural_cost]
  structural_cost:
    reference_id: cx01-reference-L123
    reference_bounds:
      parameter_count:
        min: 1
        max: 48
      depth:
        min: 1
        max: 96
      two_qubit_operation_count:
        min: 0
        max: 24
    component_weights:
      parameter_count: 1
      depth: 1
      two_qubit_operation_count: 1
    allow_operation_count_as_depth_proxy: true
  ranking:
    score_components:
      cost.structural_cost: 1
    combination: weighted_sum
    ascending: true

evolver:
  selection_mode: fitness
  policy_id: cx01-structural-smoke-selection
  metric_name: structural_cost
  keep: 2
  direction: minimize
  max_generations: 1

cx01_campaign:
  name: CX-01
  library: sanz19
  n_qubits: 4
  layers: [1, 2, 3]
  mutation:
    type: knock_in
    gate: cx
    scope: template_mutation
    propagation_policy: repeat_mutated_single_layer
  candidate_policy:
    parent_templates: all
    edges: all_valid
    placement: after_rotation_block
    acceptance: valid_all_layers
  analysis_reference:
    metrics: [expressibility, trainability, structural_cost, pareto_front]
    pareto_objectives:
      expressibility: maximize
      trainability: maximize
    cost_thresholds: [1.0, 0.2, 0.1]
    expensive_metrics_default: false

profiles:
  smoke:
    template_ids: [A02, A09]
    layers: [1]
    edges:
      - [0, 1]
      - [1, 2]
    max_candidates: 4
  full:
    template_ids: all
    layers: [1, 2, 3]
    edges: all_valid
    max_candidates: null
